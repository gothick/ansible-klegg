---

# The Hashicorp repo itself is asserted by roles/apt_repos, which always
# runs first in playbook.yml -- see that role, and group_vars/all/apt_repos.yml
# for the connection details. Re-asserting it again here too, redundantly,
# used to seem like harmless belt-and-braces; in practice it doubled our
# exposure to a real ansible-core bug (deb822_repository's underlying
# `deb822` library orders a repo's fields inconsistently between runs, so
# two independent re-assertions of the same repo in one play will
# occasionally each see the other's ordering as a "change" --
# https://github.com/ansible/ansible/issues/82454). One assertion per repo
# per play it is.

# Old-school version that ended up with these stored in /etc/apt/trusted.gpg,
# which is deprecated and will be removed in the future.
#
# - name: Add Vagrant Key
#   ansible.builtin.apt_key:
#     url: https://apt.releases.hashicorp.com/gpg

# - name: Add Vagrant Repository
#   ansible.builtin.apt_repository:
#     repo: deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main

# Because of an annoying conflict with Vagrant https://superuser.com/questions/1845776/virtualbox-cant-operate-in-vmx-mode
# This is fixed in VirtualBox 7.2.2 and when that's available in the Ubuntu repos we can remove this again.
- name: Blacklist KVM kernel modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-kvm.conf
    content: |
      blacklist kvm
      blacklist kvm_intel
      blacklist kvm_amd
    owner: root
    group: root
    mode: '0644'

- name: Install Vagrant
  ansible.builtin.apt:
    state: present
    name: vagrant
    update_cache: true
