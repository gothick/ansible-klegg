---
- name: Install the apt repository check script
  ansible.builtin.template:
    src: apt-repo-check.sh.j2
    dest: "{{ apt_repo_check_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the apt repository check systemd service
  ansible.builtin.template:
    src: apt-repo-check.service.j2
    dest: /etc/systemd/system/apt-repo-check.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart apt repo check timer

- name: Install the apt repository check systemd timer
  ansible.builtin.template:
    src: apt-repo-check.timer.j2
    dest: /etc/systemd/system/apt-repo-check.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart apt repo check timer

- name: Enable and start the apt repository check timer
  ansible.builtin.systemd_service:
    name: apt-repo-check.timer
    enabled: true
    state: started
    daemon_reload: true
