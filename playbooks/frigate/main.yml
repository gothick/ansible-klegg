---
- name: Set up Frigate NVR
  hosts: all
  become: true
  collections:
    - community.docker

  # frigate_* and nfs_mounts vars all come from group_vars/all/frigate.yml
  # and group_vars/all/frigate_vault.yml (auto-loaded, no vars_files needed
  # here) -- matches the awscli.yml/awscli_vault.yml pattern rather than
  # the local-vars.yml-per-playbook pattern the other playbooks/*/main.yml
  # files use, because Frigate (like awscli) is a specific app with its
  # own config, not generic host setup.

  roles:
    - nfs_mount

  tasks:
    # This user/group exists to own frigate_config_dir on klegg's own
    # disk -- nothing more. The Frigate container process itself runs as
    # root by default (see the frigate_uid/frigate_gid comment in
    # group_vars/all/frigate.yml for why that's deliberate, and what
    # actually governs write access to the NFS-mounted recordings dir).
    - name: Create frigate group
      ansible.builtin.group:
        name: frigate
        gid: "{{ frigate_gid }}"
        state: present

    - name: Create frigate system user
      ansible.builtin.user:
        name: frigate
        uid: "{{ frigate_uid }}"
        group: frigate
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Ensure Frigate config directory exists
      ansible.builtin.file:
        path: "{{ frigate_config_dir }}"
        state: directory
        owner: frigate
        group: frigate
        mode: '0755'

    - name: Template Frigate config.yml
      ansible.builtin.template:
        src: config.yml.j2
        dest: "{{ frigate_config_dir }}/config.yml"
        owner: frigate
        group: frigate
        mode: '0644'
      register: frigate_config_file

    - name: Pull Frigate image
      community.docker.docker_image:
        name: "{{ frigate_image }}"
        source: pull

    - name: Start Frigate container
      community.docker.docker_container:
        name: frigate
        image: "{{ frigate_image }}"
        state: started
        restart_policy: unless-stopped
        # Frigate only reads config.yml at startup, and docker_container
        # won't notice a bind-mounted file changed underneath it -- so
        # without this, a playbook run would template the new config and
        # leave the old one running. Only restarts when the template
        # actually changed, so an unchanged run stays idempotent.
        restart: "{{ frigate_config_file is changed }}"
        # Host networking, not the geerlingguy.docker bridge (which is
        # disabled anyway -- playbooks/docker/vars.yml sets
        # docker_daemon_options.bridge: "none", per the audit's Frigate/NFS
        # prerequisites note). Frigate's own go2rtc restreamer wants a
        # handful of ports (RTSP, WebRTC over TCP *and* UDP) and expects to
        # bind them directly; doing that through NAT'd bridge port
        # publishing means either hand-writing per-port FORWARD rules like
        # playbooks/firewall/main.yml already does for uptime-kuma (which
        # doesn't generalise to WebRTC's dynamic-ish port needs) or using
        # host networking and just opening the ports directly in the
        # firewall -- see playbooks/firewall/vars.yml. Also better for
        # RTSP/WebRTC latency generally, per Frigate's own docs.
        network_mode: host
        devices:
          # Intel Quick Sync / VAAPI decode via the N100's iGPU -- see the
          # hwaccel_args comment in templates/config.yml.j2 for what to do
          # if the container can't actually open this.
          - /dev/dri:/dev/dri
        mounts:
          - type: tmpfs
            target: /tmp/cache
            tmpfs_size: "1G"
        volumes:
          - "{{ frigate_config_dir }}:/config"
          - "{{ frigate_local_media_path }}:/media/frigate"
        shm_size: "{{ frigate_shm_size }}"
        detach: true
