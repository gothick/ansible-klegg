---
- name: Set up Jenkins
  hosts: all
  become: true

  vars_files:
    - jenkins_vault.yml
    - vars.yml

  roles:
    - geerlingguy.java

  # The jenkins repo itself is asserted by roles/apt_repos, which always
  # runs first in playbook.yml -- see that role, and
  # group_vars/all/apt_repos.yml for the connection details. It used to
  # also be re-asserted here; that redundant second assertion is exactly
  # what triggers https://github.com/ansible/ansible/issues/82454 (see
  # roles/vagrant/tasks/main.yml for the fuller story), so it's gone.
  tasks:
    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true
