---
# Frigate NVR: motion-triggered camera recording, running on klegg as a
# Docker container (host networking, not the geerlingguy.docker bridge --
# see the note in playbooks/frigate/main.yml for why). Recordings and
# snapshots live on the Synology, not klegg's own disk: an N100 mini-PC
# with a small root filesystem has no business hosting weeks of camera
# footage locally. See roles/nfs_mount for the mount itself.

frigate_image: "ghcr.io/blakeblackshear/frigate:stable"
frigate_config_dir: "/opt/frigate/config"

# Config schema version of the Frigate image above -- NOT the image tag.
# Frigate stamps this into config.yml and, if the file's version is missing or
# older than what the image expects, migrates the file and rewrites it on
# disk at startup. Templating a config without it (or with an old one) made
# Ansible and Frigate undo each other on every run, restarting Frigate each
# time (found live 2026-09-19). When the image moves to a new Frigate
# release, its first start migrates the file itself -- copy the migrated
# shape back into templates/config.yml.j2 and bump this to match.
frigate_config_version: "0.18-0"

# --- MQTT (Home Assistant's own Mosquitto) ---
# Used for the on-demand camera pattern below, not for anything Frigate
# needs by itself -- this could stay "enabled: false" in the template
# forever if every camera just ran continuously. homeassistant.home, not
# .local -- klegg doesn't run mDNS (separate item, noted in the audit
# doc), so a .local name won't resolve here even though it would from a
# laptop/phone on the same network.
frigate_mqtt_host: "homeassistant.home"
frigate_mqtt_port: 1883
# frigate_mqtt_username / frigate_mqtt_password: NOT here -- add them to
# group_vars/all/frigate_vault.yml by hand (same reasoning as the camera
# credentials: that file's vault-encrypted and neither sandbox can touch
# it). Use a dedicated Mosquitto login for this rather than your own HA
# user, if you haven't already got one lying around.

# --- Object detection ---
# OpenVINO device for the detector: GPU (the N100's iGPU), CPU, or NPU. If
# Frigate logs an OpenCL/GPU plugin error on startup, set this to "CPU".
frigate_detector_device: "GPU"

# Labels Frigate will track, from the COCO set the bundled OpenVINO model knows (91-class labelmap)
# (the default is person only). Anything not listed here is ignored even if
# the detector sees it. Note "package"/"parcel" is NOT in COCO -- that
# needs a Frigate+ model. By default Frigate treats car + person as review
# "alerts" and everything else tracked (cat, dog here) as "detections".
frigate_tracked_objects:
  - person
  - cat
  - dog

# 128MB is Frigate's own rule of thumb for a couple of cameras detecting
# at up to 720p (used for /tmp/cache, where segments live briefly before
# being muxed into recordings). Bump this if you add more cameras or go
# higher resolution -- too small shows up as dropped/corrupted recording
# segments, not an obvious OOM.
frigate_shm_size: "256m"

# --- NFS-mounted storage on the Synology (DS218play, 192.168.1.204) ---
frigate_synology_host: "DS218play.home"   # static DNS entry; DS218play.local (mDNS) and 192.168.1.204 also work
frigate_synology_export: "/volume1/frigate"
frigate_local_media_path: "/mnt/frigate"

# Fixed UID/GID for the frigate system user, used to own
# frigate_config_dir on klegg's own disk. NOT what governs write access
# to the NFS-mounted recordings directory, because the Frigate container
# itself runs as root by default -- upstream has open discussions/feature
# requests about supporting a non-root PUID/PGID (see
# https://github.com/blakeblackshear/frigate/discussions/18375) but it
# isn't there as a clean, documented option, so don't fight it on a first
# pass by forcing `user:` in main.yml's docker_container task -- that risks
# breaking whatever the entrypoint does for hardware/device access as root.
#
# What actually matters for the recordings mount is how the Synology's
# NFS permission rule for the "frigate" share handles ROOT requests
# specifically (DSM: Control Panel > Shared Folder > frigate > Edit > NFS
# Permissions > the rule for klegg):
#   - "No mapping" with root squashing off: root's requests really are
#     root, and root can write anywhere the export allows.
#   - Root squashed to a mapped account: root's requests land as that
#     mapped account instead, which then needs write permission on the
#     share.
# Check this before the first real run -- same class of silent-failure
# risk as the wrong UID story would have been: mounts fine, container
# writes fail. If Frigate ever does get switched to run as a fixed
# non-root user, THIS is the UID/GID that would need to match the export's
# mapping.
frigate_uid: 476
frigate_gid: 476

nfs_mounts:
  - name: frigate
    server: "{{ frigate_synology_host }}"
    export: "{{ frigate_synology_export }}"
    path: "{{ frigate_local_media_path }}"
    # No owner/group/mode here -- roles/nfs_mount doesn't manage them on
    # the mount point any more (see that role's tasks/main.yml for why:
    # found out live that it's actively wrong once the mount succeeds).
    # What actually governs write access through this mount is the
    # Synology's own NFS permission rule for the "frigate" share -- see
    # frigate_uid/frigate_gid above.

# --- Cameras ---
# One entry per camera. rtsp_path has no default on purpose -- it's
# brand-specific (Hikvision-style /Streaming/Channels/101, Reolink-style
# /h264Preview_01_main, etc.) and guessing one would be worse than
# forcing you to look it up once. credentials_key indexes into
# frigate_camera_credentials in group_vars/all/frigate_vault.yml -- OMIT
# it entirely for a camera with no RTSP auth configured; don't put fake
# credentials in just to satisfy the template, an unauthenticated
# rtsp://host:port/path is fine as far as Frigate's concerned.
#
# mjpeg: true -- set this on a camera that can only offer motion-JPEG
# (e.g. an ESP32-CAM) rather than H.264/H.265. Routes that camera through
# a go2rtc hardware-accelerated transcode first (see config.yml.j2);
# leave unset/false for any normal H.264 camera, which needs none of that.
#
# Replace/extend this list with your real cameras, then vault-encrypt
# frigate_vault.yml (see that file for the exact command) before
# committing real credentials anywhere near git.
frigate_cameras:
  - name: front_steps_camera
    # credentials_key omitted: this camera has no RTSP auth configured, so
    # there's nothing to look up in frigate_vault.yml.
    # This is an ESP32-based camera -- RTSP transport, but the actual
    # payload is motion-JPEG, not H.264. mjpeg: true routes it through the
    # go2rtc transcode in config.yml.j2 instead of feeding it to Frigate
    # raw.
    host: "192.168.1.83"
    port: 554
    rtsp_path: "/mjpeg/1"
    mjpeg: true
    detect_width: 1024
    detect_height: 768
    record_retain_days: 28
    # Object detection ON (2026-09-19): Frigate classifies what's in frame
    # (person / cat / dog, see frigate_tracked_objects) rather than just
    # recording. Still on-demand, not always-on: this ESP32 runs hot while
    # streaming, so a Home Assistant automation (PIR motion -> MQTT ON, PIR
    # clear for a while -> MQTT OFF against
    # frigate/front_steps_camera/enabled/set -- set up in HA itself, not
    # this repo) starts/stops Frigate's ffmpeg for this camera; go2rtc only
    # pulls from the camera while something's consuming its restream, so
    # the ESP32 idles and cools down between visitors. The PIR answers
    # "is something there?", Frigate answers "what?". Detection only runs
    # while the camera is switched on.
    detect_enabled: true
    # Frames/sec fed to the detector. 5 is Frigate's own recommendation;
    # going higher costs CPU for little gain. Must not exceed what the
    # ESP32 stream actually delivers.
    detect_fps: 5
